# CALConfig for the GCS-1 system (gcs-1 network, DDS domain 0).
# Services: RadioBridge (radio-bridge-gcs1) and oms_ingest (cosmos-oms).
# Message schema: ../A-GRA_subset.xsd (set RCAL_XSD_PATH to it when building).
#
# RadioBridge only touches the local gcs_1 transport (DDS domain 0); it
# reaches the quads over a reliable UDP link via the [radio_bridge] section
# below instead of joining their DDS domains directly. It listens
# (peers = []) and the quads' own RadioBridge instances dial in, so gcs-1 is
# the hub: quad-to-quad traffic relays through it too, same star topology the
# old cal_bridge produced.

[system]
id    = "GCS-1"
uuid  = "5d0c3a7e-8b21-4f6a-9c3d-2e7b1f4a6c90"
default_transport = "gcs_1"

[system.logging]
default_level = "info"

[[system.logging.sink]]
type   = "stdout"
format = "pretty"
level  = "info"

[[transport]]
id   = "gcs_1"
type = "dds"
uri  = "0"

# ── rcal_radio_bridge ──
# Topics are Both (the default): the bridge reads and writes on its local
# transport. peers is empty: gcs-1 only listens, the quads dial in.

[[service]]
id    = "RadioBridge"
label = "GCS-1 Radio Bridge"
uuid  = "54e0448e-064c-45a0-8096-752403a252c8"

[[service.topic]]
id = "PositionReport"

[[service.topic]]
id = "SystemStatus"

[[service.topic]]
id = "NavigationReport"

[[service.topic]]
id = "FlightCapabilityStatus"

[[service.topic]]
id = "FlightActivity"

[[service.topic]]
id = "SubsystemStatus"

[[service.topic]]
id = "ServiceStatus"

[radio_bridge]
bind  = "0.0.0.0:7777"
peers = []

# ── cosmos-oms ──

[[service]]
id        = "oms_ingest"
label     = "COSMOS OMS Ingest"
uuid      = "252c8f3e-b405-4164-9f0b-a7dc2c6e541b"
transport = "gcs_1"

[[service.topic]]
id = "PositionReport"
direction = "In"

[[service.topic]]
id = "SystemStatus"
direction = "In"

[[service.topic]]
id = "NavigationReport"
direction = "In"

[[service.topic]]
id = "FlightCapabilityStatus"
direction = "In"

[[service.topic]]
id = "FlightActivity"
direction = "In"

[[service.topic]]
id = "SubsystemStatus"
direction = "In"

[[service.topic]]
id = "ServiceStatus"
direction = "In"
