# frA-GRA Example System: two quadcopters and a ground control system
#
# Each quad has its own network and ASB (DDS domain). The quad networks are not
# connected to each other. The GCS-1 network holds cosmos-oms and cal_bridge,
# which joins all three networks and repeats UCI messages across the three ASBs.
#
# Data flow:
#   [quad-1] ArduPilot SITL → rcal-ardupilot-1 → ASB (DDS domain 1) ─┐
#                                                                   ├→ cal_bridge → ASB (DDS domain 0) → cosmos-oms   [gcs-1]
#   [quad-2] ArduPilot SITL → rcal-ardupilot-2 → ASB (DDS domain 2) ─┘
#
# Prerequisites: Docker 24+ with Compose V2
# Usage: docker compose up

services:

  # ── quad-1 ──

  # ArduPilot SITL, quad 1 (MAVLink system ID 1)
  ardupilot-sitl-1:
    image: ardupilot-sitl:latest
    build:
      context: ../../ardupilot
    environment:
      - INSTANCE=0
      - SPEEDUP=1
      - MAVPROXY_OUTS=udp:rcal-ardupilot-1:14550
    networks:
      - quad-1

  # MAVLink-to-UCI gateway for quad 1, publishes on DDS domain 1
  rcal-ardupilot-1:
    image: rcal-ardupilot:latest
    build:
      context: ../../rcal-ardupilot
      additional_contexts:
        schema: .
        rcal: ../../rcal/rcal
    environment:
      - RCAL_CALCONFIG_PATH=/app/CALConfig.toml
    volumes:
      - ./quad-1/CALConfig.toml:/app/CALConfig.toml:ro
    depends_on:
      - ardupilot-sitl-1
    networks:
      - quad-1

  # ── quad-2 ──

  # ArduPilot SITL, quad 2 (MAVLink system ID 2)
  ardupilot-sitl-2:
    image: ardupilot-sitl:latest
    build:
      context: ../../ardupilot
    environment:
      - INSTANCE=1
      - SPEEDUP=1
      - MAVPROXY_OUTS=udp:rcal-ardupilot-2:14550
    networks:
      - quad-2

  # MAVLink-to-UCI gateway for quad 2, publishes on DDS domain 2
  rcal-ardupilot-2:
    image: rcal-ardupilot:latest
    build:
      context: ../../rcal-ardupilot
      additional_contexts:
        schema: .
        rcal: ../../rcal/rcal
    environment:
      - RCAL_CALCONFIG_PATH=/app/CALConfig.toml
    volumes:
      - ./quad-2/CALConfig.toml:/app/CALConfig.toml:ro
    depends_on:
      - ardupilot-sitl-2
    networks:
      - quad-2

  # ── GCS-1 ──

  # CAL bridge: repeats UCI messages across the quad-1, quad-2, and GCS-1 ASBs
  cal-bridge:
    image: rcal-cal_bridge:latest
    build:
      context: ../../rcal/rcal
      additional_contexts:
        example: .
      dockerfile_inline: |
        FROM rust:slim-bookworm AS builder
        WORKDIR /build
        COPY . .
        COPY --from=example A-GRA_subset.xsd /schema/
        RUN RCAL_XSD_PATH=/schema/A-GRA_subset.xsd cargo build --release --features bridge,tui --bin cal_bridge --bin asb_dump --bin asb_view

        FROM debian:bookworm-slim
        WORKDIR /app
        COPY --from=builder /build/target/release/cal_bridge /build/target/release/asb_dump /build/target/release/asb_view /usr/local/bin/
        ENV RCAL_CALCONFIG_PATH=/app/CALConfig.toml
    command: ["cal_bridge", "/app/CALConfig.toml"]
    volumes:
      - ./gcs-1/CALConfig.toml:/app/CALConfig.toml:ro
    depends_on:
      - rcal-ardupilot-1
      - rcal-ardupilot-2
    networks:
      - quad-1
      - quad-2
      - gcs-1

  # OpenC3/COSMOS OMS plugin, subscribes on DDS domain 0
  # Sees UCI messages from both quads through cal-bridge
  cosmos-oms:
    image: cosmos-oms:latest
    # Mirrors cosmos-oms/Dockerfile, but takes the XSD and CALConfig from this example.
    build:
      context: ../../cosmos-oms
      additional_contexts:
        example: .
        rcal: ../../rcal/rcal
      dockerfile_inline: |
        FROM rust:alpine AS builder
        RUN apk add --no-cache musl-dev
        RUN rustup target add x86_64-unknown-linux-musl
        WORKDIR /build
        COPY Cargo.toml Cargo.lock build.rs ./
        COPY .cargo ./.cargo
        COPY src ./src
        COPY --from=example A-GRA_subset.xsd gcs-1/CALConfig.toml ./config/
        # rcal 3.0.1 on crates.io doesn't compile against A-GRA (fixed in rcal#130); use the submodule until released
        COPY --from=rcal . /rcal
        RUN printf '\n[patch.crates-io]\nrcal = { path = "/rcal" }\nrcal_macros = { path = "/rcal/rcal_macros" }\n' >> Cargo.toml
        ENV RCAL_XSD_PATH=/build/config/A-GRA_subset.xsd
        ENV RCAL_CALCONFIG_PATH=/build/config/CALConfig.toml
        ENV RCAL_CALCONFIG_SERVICES=oms_ingest
        RUN cargo build --release --target x86_64-unknown-linux-musl -p oms_bridge

        FROM ruby:3-alpine AS gem-builder
        WORKDIR /plugin
        COPY cosmos-oms.gemspec plugin.txt ./
        COPY microservices ./microservices
        COPY --from=builder /build/targets/OMS/cmd_tlm/oms_generated.txt ./targets/OMS/cmd_tlm/
        COPY --from=builder /build/target/x86_64-unknown-linux-musl/release/oms_bridge ./microservices/OMS_BRIDGE/bin/oms_bridge
        RUN gem build cosmos-oms.gemspec -o cosmos-oms.gem

        FROM openc3inc/openc3-operator:7.4.0
        COPY --from=builder /build/target/x86_64-unknown-linux-musl/release/oms_bridge /usr/local/bin/oms_bridge
        COPY --from=gem-builder /plugin/cosmos-oms.gem /cosmos-oms.gem
        COPY plugin_instance.json /plugin_instance.json
    environment:
      - RCAL_CALCONFIG_PATH=/app/CALConfig.toml
      - COSMOS_HOST=cosmos
      - COSMOS_PORT=7779
    volumes:
      - ./gcs-1/CALConfig.toml:/app/CALConfig.toml:ro
    depends_on:
      - cal-bridge
    networks:
      - gcs-1

networks:
  quad-1:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: mcast-br0
  quad-2:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: mcast-br1
  gcs-1:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: mcast-br2
